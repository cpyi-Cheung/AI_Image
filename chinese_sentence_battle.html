<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>兒童中文排句大比拼 - 電子白板雙人對戰版</title>
  <style>
    :root {
      --p1-color: #2563EB;
      --p1-bg: #EFF6FF;
      --p2-color: #DC2626;
      --p2-bg: #FEF2F2;
      --success-color: #10B981;
      --card-bg: #FFFFFF;
      --border-radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'PingFang HK', 'Microsoft JhengHei', 'Noto Sans TC', sans-serif;
      background-color: #0F172A;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none; /* 徹底封鎖全域滾動與橡皮筋回彈 */
    }

    /* 16:9 標準比例視窗 */
    #app-viewport {
      width: 100vw;
      height: calc(100vw * 9 / 16);
      max-height: 100vh;
      max-width: calc(100vh * 16 / 9);
      aspect-ratio: 16 / 9;
      background-color: #F8FAFC;
      position: relative;
      border-radius: 16px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* 頁面切換 */
    .screen {
      display: none;
      width: 100%;
      height: 100%;
      flex-direction: column;
    }

    .screen.active {
      display: flex;
    }

    /* 1. 開始頁面 (保密版) */
    #start-screen {
      background: linear-gradient(135deg, #A8EDEA 0%, #FED6E3 100%);
      justify-content: center;
      align-items: center;
      padding: 2vw;
      position: relative;
    }

    .start-card {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 24px;
      padding: 3vw 4vw;
      width: 75%;
      max-width: 700px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.12);
      text-align: center;
    }

    .start-card h1 {
      font-size: 2.4rem;
      color: #0F172A;
      margin-bottom: 0.8vw;
    }

    .start-card p.subtitle {
      color: #475569;
      font-size: 1.1rem;
      margin-bottom: 2vw;
    }

    .btn-start {
      background: linear-gradient(45deg, #FF6B6B, #FF8E53);
      color: white;
      border: none;
      padding: 16px 55px;
      font-size: 1.5rem;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(255, 107, 107, 0.4);
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .btn-start:active {
      transform: scale(0.96);
    }

    .btn-teacher-setup {
      position: absolute;
      top: 16px;
      right: 16px;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid #CBD5E1;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: bold;
      color: #475569;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      z-index: 20;
    }

    /* 2. 遊戲主頁面 Header (頂部導引欄) */
    #game-header {
      height: 48px;
      background: #FFFFFF;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 12px;
      border-bottom: 1px solid #E2E8F0;
      z-index: 10;
      flex-shrink: 0;
    }

    .header-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .header-title {
      font-size: 1rem;
      font-weight: bold;
      color: #0F172A;
      padding: 0 8px;
    }

    .btn-icon {
      background: #F1F5F9;
      border: 1px solid #E2E8F0;
      padding: 5px 12px;
      border-radius: 18px;
      font-size: 0.82rem;
      font-weight: bold;
      color: #475569;
      cursor: pointer;
      transition: background-color 0.15s;
    }

    .btn-icon:active {
      background-color: #E2E8F0;
    }

    .btn-nav-nav {
      background: #F0F9FF;
      color: #0369A1;
      border-color: #BAE6FD;
    }

    .btn-home-top {
      background: #FEF2F2;
      color: #991B1B;
      border-color: #FCA5A5;
    }

    .battle-container {
      flex: 1;
      display: flex;
      width: 100%;
      height: calc(100% - 48px);
      position: relative;
    }

    .player-side {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 8px 12px;
      position: relative;
      height: 100%;
    }

    .player-side.p1 {
      background-color: var(--p1-bg);
      border-right: 2px dashed #CBD5E1;
    }

    .player-side.p2 {
      background-color: var(--p2-bg);
    }

    .player-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 3px;
    }

    .player-tag {
      padding: 2px 10px;
      border-radius: 12px;
      color: white;
      font-weight: bold;
      font-size: 0.85rem;
    }

    .p1 .player-tag { background-color: var(--p1-color); }
    .p2 .player-tag { background-color: var(--p2-color); }

    .zone-title {
      font-size: 0.8rem;
      color: #64748B;
      margin-bottom: 3px;
      font-weight: bold;
    }

    /* 待選詞語池：選項靠下沉底 (align-content: flex-end)，留白在上方 */
    .pool-zone {
      flex: 1;
      min-height: 75px;
      background: rgba(255, 255, 255, 0.75);
      border-radius: var(--border-radius);
      padding: 8px;
      display: flex;
      flex-wrap: wrap;
      align-content: flex-end; /* 將詞牌沉底 */
      justify-content: flex-start;
      gap: 8px;
      border: 2px dashed #CBD5E1;
      margin-bottom: 6px;
      overflow-y: auto;
    }

    /* 答案放置區：135px 充足高度，確保長句折行不裁切 */
    .drop-zone {
      height: 135px;
      min-height: 135px;
      background: rgba(255, 255, 255, 0.95);
      border: 2px dashed #94A3B8;
      border-radius: var(--border-radius);
      padding: 8px;
      display: flex;
      flex-wrap: wrap;
      align-content: flex-start;
      gap: 8px;
      transition: border-color 0.2s, background-color 0.2s;
      overflow-y: auto;
    }

    .drop-zone.correct {
      border-color: var(--success-color);
      background-color: #ECFDF5;
    }

    .drop-zone.wrong {
      border-color: #EF4444;
      background-color: #FEF2F2;
    }

    /* 詞語卡片 (1.4rem 大字體，電子白板清晰易讀) */
    .word-card {
      touch-action: none;
      will-change: transform;
      user-select: none;
      -webkit-user-select: none;
      cursor: grab;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 18px;
      font-size: 1.4rem;
      font-weight: bold;
      color: #0F172A;
      background: var(--card-bg);
      border-radius: 10px;
      box-shadow: 0 3px 6px rgba(0,0,0,0.08);
      border: 2px solid #CBD5E1;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }

    .word-card.dragging {
      opacity: 0.9;
      transform: scale(1.1) !important;
      box-shadow: 0 12px 24px rgba(0,0,0,0.2) !important;
      z-index: 9999 !important;
      pointer-events: none;
    }

    /* 實時插隊預覽虛線框 */
    .card-placeholder {
      background: rgba(37, 99, 235, 0.08);
      border: 2px dashed #2563EB;
      border-radius: 10px;
      display: inline-block;
      transition: all 0.1s ease;
    }

    /* 控制按鈕區 */
    .controls {
      display: flex;
      gap: 8px;
      margin-top: 6px;
    }

    .btn-action {
      flex: 1;
      padding: 7px;
      border: none;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      color: white;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      transition: opacity 0.15s, transform 0.1s;
    }

    .btn-clear { background-color: #64748B; }
    .btn-check { background-color: var(--success-color); }
    .btn-speak { background-color: #0EA5E9; }

    /* 狀態提示 */
    .status-msg {
      height: 16px;
      font-size: 0.8rem;
      font-weight: bold;
      text-align: center;
      margin-top: 2px;
    }
    .status-msg.correct { color: var(--success-color); }
    .status-msg.wrong { color: #EF4444; }

    /* Modal Overlays */
    .modal-overlay {
      display: none;
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.65);
      z-index: 10000;
      justify-content: center;
      align-items: center;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-box {
      background: white;
      padding: 24px 32px;
      border-radius: 20px;
      text-align: center;
      max-width: 520px;
      width: 88%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    }

    .modal-box h2 {
      font-size: 1.5rem;
      color: #0F172A;
      margin-bottom: 8px;
    }

    .modal-box p {
      color: #64748B;
      margin-bottom: 16px;
      font-size: 0.95rem;
    }

    .custom-input-group {
      text-align: left;
      margin-bottom: 12px;
    }

    .custom-input-group label {
      display: block;
      font-weight: bold;
      color: #334155;
      margin-bottom: 6px;
      font-size: 0.9rem;
    }

    .custom-input-group textarea {
      width: 100%;
      height: 110px;
      border: 2px solid #CBD5E1;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.95rem;
      resize: none;
      outline: none;
      font-family: inherit;
    }

    .modal-btn-row {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn-secondary {
      background: #F1F5F9;
      color: #475569;
      border: 1px solid #CBD5E1;
      padding: 8px 18px;
      font-size: 0.9rem;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
    }

    .btn-next, .btn-save-setup {
      background: linear-gradient(45deg, #10B981, #059669);
      color: white;
      border: none;
      padding: 9px 26px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(16, 185, 129, 0.4);
    }
  </style>
</head>
<body>

  <!-- 16:9 主容器 -->
  <div id="app-viewport">

    <!-- 1. 開始頁面 (學生隱藏答案保密版) -->
    <div id="start-screen" class="screen active">
      <button type="button" class="btn-teacher-setup" onclick="openTeacherModal()">⚙️ 教師題目設定</button>
      
      <div class="start-card">
        <h1>👦👧 雙人中文排句大比拼</h1>
        <p class="subtitle">待選詞牌在上方，點擊或拖拽放置到下方答案區！</p>
        <button type="button" class="btn-start" onclick="startGame(event)">開始對戰 🚀</button>
      </div>
    </div>

    <!-- 2. 教師題目設定彈窗 (含匯入/匯出功能) -->
    <div class="modal-overlay" id="teacher-modal">
      <div class="modal-box">
        <h2>⚙️ 教師題目設定</h2>
        <p>設定的題目會自動儲存在本地，學生在主畫面看不到！</p>
        
        <div class="custom-input-group">
          <label for="sentence-input">題目列表 (每行一題，使用斜線「/」劃分詞語)：</label>
          <textarea id="sentence-input">今天， / 弟弟 / 忘記 / 帶 / 顏色筆 / 。
哥哥 / 長得 / 比 / 我 / 高 / 。
小狗 / 跑得 / 非常 / 快 / 。
弟弟 / 像 / 小豬 / 那麼 / 貪吃 / 。
小狗的 / 毛髮 / 像 / 棉花 / 一樣 / 柔軟 / 。
天上的 / 星星 / 像燈泡 / 一樣 / 明亮 / 。
早上 / 的時候 / ， / 我 / 聽見 / 小鳥 / 在 / 唱歌 / 。
放學後 / ， / 小明 / 在房間裏 / 認真地 / 做功課 / 。
爸爸 / 在暑假時 / 帶我 / 去沙灘 / 游泳 / 。</textarea>
        </div>

        <!-- 隱藏的檔案選擇器，用於匯入 .txt 文件 -->
        <input type="file" id="import-file-input" accept=".txt" style="display: none;" onchange="handleImportFile(event)">

        <div class="modal-btn-row">
          <button type="button" class="btn-secondary" onclick="exportSentences()">📥 匯出題目檔</button>
          <button type="button" class="btn-secondary" onclick="triggerImportFile()">📤 匯入題目檔</button>
          <button type="button" class="btn-save-setup" onclick="saveTeacherSetup()">💾 儲存並關閉</button>
        </div>
      </div>
    </div>

    <!-- 3. 遊戲主頁面 (Header 包含上一題/下一題) -->
    <div id="game-screen" class="screen">
      <div id="game-header">
        <div class="header-group">
          <button type="button" class="btn-icon btn-nav-nav" onclick="prevQuestion()">⬅️ 上一題</button>
          <button type="button" class="btn-icon" onclick="resetCurrentQuestion()">🔄 重置本題</button>
        </div>

        <div class="header-title" id="question-indicator">第 1 / 9 題</div>

        <div class="header-group">
          <button type="button" class="btn-icon btn-nav-nav" onclick="manualNextQuestion()">下一題 ➡️</button>
          <button type="button" class="btn-icon btn-home-top" onclick="goHome()">🏠 首頁</button>
        </div>
      </div>

      <div class="battle-container">
        <!-- 玩家 1 (左側藍色) -->
        <div class="player-side p1" data-player="p1">
          <div class="player-header">
            <div class="player-tag">玩家 1 (Blue)</div>
          </div>
          
          <div class="zone-title">待選詞語 (點擊或拖拽)：</div>
          <div class="pool-zone" id="p1-pool"></div>

          <div class="zone-title">答案放置區：</div>
          <div class="drop-zone" id="p1-drop"></div>

          <div class="status-msg" id="p1-status"></div>

          <div class="controls">
            <button type="button" class="btn-action btn-clear" onclick="clearPlayerZone('p1')">清空</button>
            <button type="button" class="btn-action btn-speak" onclick="speakCurrentSentence('p1')">🔊 朗讀</button>
            <button type="button" class="btn-action btn-check" onclick="checkPlayerAnswer('p1')">✅ 檢查</button>
          </div>
        </div>

        <!-- 玩家 2 (右側紅色) -->
        <div class="player-side p2" data-player="p2">
          <div class="player-header">
            <div class="player-tag">玩家 2 (Red)</div>
          </div>
          
          <div class="zone-title">待選詞語 (點擊或拖拽)：</div>
          <div class="pool-zone" id="p2-pool"></div>

          <div class="zone-title">答案放置區：</div>
          <div class="drop-zone" id="p2-drop"></div>

          <div class="status-msg" id="p2-status"></div>

          <div class="controls">
            <button type="button" class="btn-action btn-clear" onclick="clearPlayerZone('p2')">清空</button>
            <button type="button" class="btn-action btn-speak" onclick="speakCurrentSentence('p2')">🔊 朗讀</button>
            <button type="button" class="btn-action btn-check" onclick="checkPlayerAnswer('p2')">✅ 檢查</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 通關 Modal Overlay -->
    <div class="modal-overlay" id="next-modal">
      <div class="modal-box">
        <h2 id="modal-title">🎉 雙方順利通關！</h2>
        <p id="modal-desc">正確句子：今天，弟弟忘記帶顏色筆。</p>
        <button type="button" class="btn-next" onclick="nextQuestion()">下一題 ➔</button>
      </div>
    </div>

  </div>

  <script>
    const DEFAULT_SENTENCES = "今天， / 弟弟 / 忘記 / 帶 / 顏色筆 / 。\n哥哥 / 長得 / 比 / 我 / 高 / 。\n小狗 / 跑得 / 非常 / 快 / 。\n弟弟 / 像 / 小豬 / 那麼 / 貪吃 / 。\n小狗的 / 毛髮 / 像 / 棉花 / 一樣 / 柔軟 / 。\n天上的 / 星星 / 像燈泡 / 一樣 / 明亮 / 。\n早上 / 的時候 / ， / 我 / 聽見 / 小鳥 / 在 / 唱歌 / 。\n放學後 / ， / 小明 / 在房間裏 / 認真地 / 做功課 / 。\n爸爸 / 在暑假時 / 帶我 / 去沙灘 / 游泳 / 。";
    let questions = [];
    let currentQIndex = 0;
    let playerState = { p1: { correct: false }, p2: { correct: false } };

    let audioCtx = null;
    const activeTouches = new Map();

    // 安全讀取與寫入 localStorage
    function safeGetStorage(key) {
      try { return localStorage.getItem(key); } catch(e) { return null; }
    }
    function safeSetStorage(key, val) {
      try { localStorage.setItem(key, val); } catch(e) {}
    }

    // 初始化
    window.addEventListener('DOMContentLoaded', () => {
      const saved = safeGetStorage('custom_sentences_list');
      const inputEl = document.getElementById('sentence-input');
      if (inputEl) {
        inputEl.value = (saved && saved.trim()) ? saved : DEFAULT_SENTENCES;
      }
    });

    function openTeacherModal() {
      playAudioTone('click');
      document.getElementById('teacher-modal').classList.add('active');
    }

    function saveTeacherSetup() {
      playAudioTone('click');
      const val = document.getElementById('sentence-input').value;
      safeSetStorage('custom_sentences_list', val);
      document.getElementById('teacher-modal').classList.remove('active');
    }

    // 匯出題目檔 (下載備份 .txt)
    function exportSentences() {
      playAudioTone('click');
      const text = document.getElementById('sentence-input').value;
      const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'ChineseSentences_Backup.txt';
      a.click();
      URL.revokeObjectURL(a.href);
    }

    // 觸發匯入檔案視窗
    function triggerImportFile() {
      playAudioTone('click');
      document.getElementById('import-file-input').click();
    }

    // 處理匯入的檔案內容
    function handleImportFile(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const content = e.target.result;
        document.getElementById('sentence-input').value = content;
        safeSetStorage('custom_sentences_list', content);
        alert('🎉 題目檔已成功匯入並儲存！');
      };
      reader.readAsText(file, 'UTF-8');
      event.target.value = '';
    }

    // Web Audio API 音效
    function playAudioTone(type) {
      try {
        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) audioCtx = new AudioContextClass();
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        if (!audioCtx) return;

        if (type === 'correct') {
          const freqs = [523.25, 659.25, 783.99, 1046.50];
          freqs.forEach((f, i) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.frequency.value = f;
            gain.gain.setValueAtTime(0.12, audioCtx.currentTime + i * 0.08);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + i * 0.08 + 0.2);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(audioCtx.currentTime + i * 0.08);
            osc.stop(audioCtx.currentTime + i * 0.08 + 0.2);
          });
        } else if (type === 'wrong') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220, audioCtx.currentTime);
          osc.frequency.linearRampToValueAtTime(130, audioCtx.currentTime + 0.25);
          gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.25);
        } else if (type === 'click') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.frequency.value = 600;
          gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.04);
        }
      } catch (e) {}
    }

    // Web Speech API 粵語朗讀
    function speakText(text) {
      if (!('speechSynthesis' in window) || !text) return;
      try {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'zh-HK';
        utterance.rate = 0.85;

        const voices = window.speechSynthesis.getVoices();
        const cantoneseVoice = voices.find(v => v.lang.includes('zh-HK') || v.lang.includes('yue') || v.lang.includes('HK'));
        if (cantoneseVoice) utterance.voice = cantoneseVoice;
        window.speechSynthesis.speak(utterance);
      } catch(e) {}
    }

    // 解析題目
    function parseSentences(inputStr) {
      const lines = inputStr.split('\n').map(l => l.trim()).filter(l => l.length > 0);
      return lines.map(line => {
        let tokens = line.split('/').map(t => t.trim()).filter(t => t.length > 0);
        if (tokens.length <= 1) tokens = line.split('');
        return { originalSentence: tokens.join(''), tokens: tokens };
      });
    }

    // 開始遊戲
    function startGame(e) {
      if (e) e.preventDefault();
      playAudioTone('click');
      
      const inputEl = document.getElementById('sentence-input');
      let inputVal = inputEl ? inputEl.value.trim() : '';
      if (!inputVal) inputVal = DEFAULT_SENTENCES;
      
      questions = parseSentences(inputVal);
      if (!questions || questions.length === 0) {
        questions = parseSentences(DEFAULT_SENTENCES);
      }
      
      currentQIndex = 0;
      document.getElementById('start-screen').classList.remove('active');
      document.getElementById('game-screen').classList.add('active');
      loadQuestion(currentQIndex);
    }

    function goHome() {
      playAudioTone('click');
      document.getElementById('game-screen').classList.remove('active');
      document.getElementById('start-screen').classList.add('active');
      document.getElementById('next-modal').classList.remove('active');
    }

    // 題目切換邏輯 (上一題 / 下一題)
    function prevQuestion() {
      playAudioTone('click');
      if (currentQIndex > 0) {
        currentQIndex--;
        loadQuestion(currentQIndex);
      } else {
        alert('已經是第一題囉！');
      }
    }

    function manualNextQuestion() {
      playAudioTone('click');
      if (currentQIndex < questions.length - 1) {
        currentQIndex++;
        loadQuestion(currentQIndex);
      } else {
        alert('已經是最後一題囉！');
      }
    }

    // 載入題目
    function loadQuestion(index) {
      playerState.p1.correct = false;
      playerState.p2.correct = false;

      document.getElementById('question-indicator').innerText = `第 ${index + 1} / ${questions.length} 題`;
      const q = questions[index];

      ['p1', 'p2'].forEach(p => {
        const drop = document.getElementById(`${p}-drop`);
        const pool = document.getElementById(`${p}-pool`);
        const status = document.getElementById(`${p}-status`);
        
        drop.innerHTML = '';
        pool.innerHTML = '';
        drop.className = 'drop-zone';
        status.innerText = '';
        status.className = 'status-msg';

        const shuffled = [...q.tokens].sort(() => Math.random() - 0.5);
        shuffled.forEach((word, idx) => {
          const card = createWordCard(word, p, `${p}-card-${idx}`);
          pool.appendChild(card);
        });
      });
    }

    function createWordCard(text, playerId, id) {
      const card = document.createElement('div');
      card.className = 'word-card';
      card.innerText = text;
      card.id = id;
      card.dataset.player = playerId;

      card.addEventListener('touchstart', handleTouchStart, { passive: false });
      card.addEventListener('touchmove', handleTouchMove, { passive: false });
      card.addEventListener('touchend', handleTouchEnd, { passive: false });
      card.addEventListener('touchcancel', handleTouchEnd, { passive: false });
      card.addEventListener('mousedown', handleMouseDown);

      return card;
    }

    /* ---------------- 【核心計算】計算拖拽放置的最佳插隊位置 ---------------- */
    function getInsertBeforeElement(container, touchX, touchY) {
      const cards = Array.from(container.querySelectorAll('.word-card:not(.dragging), .card-placeholder'));
      if (cards.length === 0) return null;

      let closestChild = null;
      let minDistance = Infinity;

      cards.forEach(child => {
        const rect = child.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;

        const dx = touchX - centerX;
        const dy = touchY - centerY;
        const dist = dx * dx + dy * dy * 2.5;

        if (dist < minDistance) {
          minDistance = dist;
          if (touchY < rect.top) {
            closestChild = child;
          } else if (touchY > rect.bottom) {
            closestChild = child.nextSibling;
          } else if (touchX < centerX) {
            closestChild = child;
          } else {
            closestChild = child.nextSibling;
          }
        }
      });

      return closestChild;
    }

    /* ---------------- 原生多點觸控 (Multi-touch) 邏輯 ---------------- */

    function handleTouchStart(e) {
      e.preventDefault();
      for (let i = 0; i < e.changedTouches.length; i++) {
        const touch = e.changedTouches[i];
        const card = e.currentTarget;
        const rect = card.getBoundingClientRect();

        activeTouches.set(touch.identifier, {
          card: card,
          playerId: card.dataset.player,
          startX: touch.clientX,
          startY: touch.clientY,
          offsetX: touch.clientX - rect.left,
          offsetY: touch.clientY - rect.top,
          moved: false,
          initialRect: rect,
          placeholder: null,
          isFloating: false
        });
      }
    }

    function handleTouchMove(e) {
      e.preventDefault();
      for (let i = 0; i < e.changedTouches.length; i++) {
        const touch = e.changedTouches[i];
        const session = activeTouches.get(touch.identifier);
        if (!session) continue;

        const dx = touch.clientX - session.startX;
        const dy = touch.clientY - session.startY;

        if (Math.hypot(dx, dy) > 6) session.moved = true;

        if (session.moved) {
          if (!session.isFloating) {
            session.isFloating = true;
            const ph = document.createElement('div');
            ph.className = 'card-placeholder';
            ph.style.width = session.initialRect.width + 'px';
            ph.style.height = session.initialRect.height + 'px';
            session.placeholder = ph;
            session.card.parentNode.insertBefore(ph, session.card);

            document.getElementById('app-viewport').appendChild(session.card);
            session.card.classList.add('dragging');
          }

          const viewportRect = document.getElementById('app-viewport').getBoundingClientRect();
          session.card.style.position = 'absolute';
          session.card.style.left = (touch.clientX - viewportRect.left - session.offsetX) + 'px';
          session.card.style.top = (touch.clientY - viewportRect.top - session.offsetY) + 'px';

          session.card.style.display = 'none';
          const targetEl = document.elementFromPoint(touch.clientX, touch.clientY);
          session.card.style.display = '';

          if (targetEl) {
            const dropZone = targetEl.closest(`.player-side[data-player="${session.playerId}"] .drop-zone`);
            const poolZone = targetEl.closest(`.player-side[data-player="${session.playerId}"] .pool-zone`);
            const targetZone = dropZone || poolZone;

            if (targetZone) {
              const beforeEl = getInsertBeforeElement(targetZone, touch.clientX, touch.clientY);
              if (beforeEl && beforeEl !== session.placeholder) {
                targetZone.insertBefore(session.placeholder, beforeEl);
              } else if (!beforeEl) {
                targetZone.appendChild(session.placeholder);
              }
            }
          }
        }
      }
    }

    function handleTouchEnd(e) {
      e.preventDefault();
      for (let i = 0; i < e.changedTouches.length; i++) {
        const touch = e.changedTouches[i];
        const session = activeTouches.get(touch.identifier);
        if (!session) continue;

        activeTouches.delete(touch.identifier);

        if (session.isFloating) {
          session.card.classList.remove('dragging');
          session.card.style.position = '';
          session.card.style.left = '';
          session.card.style.top = '';

          if (session.placeholder && session.placeholder.parentNode) {
            session.placeholder.parentNode.insertBefore(session.card, session.placeholder);
            session.placeholder.remove();
            playAudioTone('click');
          } else {
            document.querySelector(`.player-side[data-player="${session.playerId}"] .pool-zone`).appendChild(session.card);
          }
          return;
        }

        if (!session.moved) {
          playAudioTone('click');
          toggleCardLocation(session.card, session.playerId);
        }
      }
    }

    /* ---------------- 滑鼠相容支援 (Mouse Drag & Drop) ---------------- */
    let mouseSession = null;

    function handleMouseDown(e) {
      if (e.type === 'touchstart') return;
      const card = e.currentTarget;
      const rect = card.getBoundingClientRect();

      mouseSession = {
        card: card,
        playerId: card.dataset.player,
        startX: e.clientX,
        startY: e.clientY,
        offsetX: e.clientX - rect.left,
        offsetY: e.clientY - rect.top,
        moved: false,
        initialRect: rect,
        placeholder: null,
        isFloating: false
      };

      window.addEventListener('mousemove', handleMouseMove);
      window.addEventListener('mouseup', handleMouseUp);
    }

    function handleMouseMove(e) {
      if (!mouseSession) return;
      const dx = e.clientX - mouseSession.startX;
      const dy = e.clientY - mouseSession.startY;

      if (Math.hypot(dx, dy) > 6) mouseSession.moved = true;

      if (mouseSession.moved) {
        if (!mouseSession.isFloating) {
          mouseSession.isFloating = true;
          const ph = document.createElement('div');
          ph.className = 'card-placeholder';
          ph.style.width = mouseSession.initialRect.width + 'px';
          ph.style.height = mouseSession.initialRect.height + 'px';
          mouseSession.placeholder = ph;
          mouseSession.card.parentNode.insertBefore(ph, mouseSession.card);

          document.getElementById('app-viewport').appendChild(mouseSession.card);
          mouseSession.card.classList.add('dragging');
        }

        const viewportRect = document.getElementById('app-viewport').getBoundingClientRect();
        mouseSession.card.style.position = 'absolute';
        mouseSession.card.style.left = (e.clientX - viewportRect.left - mouseSession.offsetX) + 'px';
        mouseSession.card.style.top = (e.clientY - viewportRect.top - mouseSession.offsetY) + 'px';

        mouseSession.card.style.display = 'none';
        const targetEl = document.elementFromPoint(e.clientX, e.clientY);
        mouseSession.card.style.display = '';

        if (targetEl) {
          const dropZone = targetEl.closest(`.player-side[data-player="${mouseSession.playerId}"] .drop-zone`);
          const poolZone = targetEl.closest(`.player-side[data-player="${mouseSession.playerId}"] .pool-zone`);
          const targetZone = dropZone || poolZone;

          if (targetZone) {
            const beforeEl = getInsertBeforeElement(targetZone, e.clientX, e.clientY);
            if (beforeEl && beforeEl !== mouseSession.placeholder) {
              targetZone.insertBefore(mouseSession.placeholder, beforeEl);
            } else if (!beforeEl) {
              targetZone.appendChild(mouseSession.placeholder);
            }
          }
        }
      }
    }

    function handleMouseUp(e) {
      if (!mouseSession) return;
      window.removeEventListener('mousemove', handleMouseMove);
      window.removeEventListener('mouseup', handleMouseUp);

      const session = mouseSession;
      mouseSession = null;

      if (session.isFloating) {
        session.card.classList.remove('dragging');
        session.card.style.position = '';
        session.card.style.left = '';
        session.card.style.top = '';

        if (session.placeholder && session.placeholder.parentNode) {
          session.placeholder.parentNode.insertBefore(session.card, session.placeholder);
          session.placeholder.remove();
          playAudioTone('click');
        } else {
          document.querySelector(`.player-side[data-player="${session.playerId}"] .pool-zone`).appendChild(session.card);
        }
        return;
      }

      if (!session.moved) {
        playAudioTone('click');
        toggleCardLocation(session.card, session.playerId);
      }
    }

    /* ---------------- 點擊 (Tap) 自動移動 ---------------- */
    function toggleCardLocation(card, playerId) {
      const dropZone = document.getElementById(`${playerId}-drop`);
      const poolZone = document.getElementById(`${playerId}-pool`);

      if (card.parentElement === poolZone) {
        dropZone.appendChild(card);
      } else {
        poolZone.appendChild(card);
      }
    }

    /* ---------------- 遊戲邏輯控制 ---------------- */

    function clearPlayerZone(playerId) {
      playAudioTone('click');
      const dropZone = document.getElementById(`${playerId}-drop`);
      const poolZone = document.getElementById(`${playerId}-pool`);
      const cards = Array.from(dropZone.children);
      cards.forEach(card => poolZone.appendChild(card));
      
      dropZone.className = 'drop-zone';
      document.getElementById(`${playerId}-status`).innerText = '';
    }

    function speakCurrentSentence(playerId) {
      const dropZone = document.getElementById(`${playerId}-drop`);
      const cards = Array.from(dropZone.children);
      if (cards.length === 0) {
        speakText('請先排列詞語');
        return;
      }
      const text = cards.map(c => c.innerText).join('');
      speakText(text);
    }

    function checkPlayerAnswer(playerId) {
      const dropZone = document.getElementById(`${playerId}-drop`);
      const status = document.getElementById(`${playerId}-status`);
      const currentSentence = questions[currentQIndex].originalSentence;

      const userSentence = Array.from(dropZone.children).map(c => c.innerText).join('');

      if (userSentence === currentSentence) {
        playerState[playerId].correct = true;
        dropZone.className = 'drop-zone correct';
        status.innerText = '🎉 答對了！太棒了！';
        status.className = 'status-msg correct';
        
        playAudioTone('correct');
        speakText(userSentence);

        checkBothFinished();
      } else {
        playerState[playerId].correct = false;
        dropZone.className = 'drop-zone wrong';
        status.innerText = '❌ 再試一次哦！';
        status.className = 'status-msg wrong';
        
        playAudioTone('wrong');
      }
    }

    function checkBothFinished() {
      if (playerState.p1.correct && playerState.p2.correct) {
        setTimeout(() => {
          document.getElementById('modal-title').innerText = '🏆 雙方完美通關！';
          document.getElementById('modal-desc').innerText = `正確句子：${questions[currentQIndex].originalSentence}`;
          document.getElementById('next-modal').classList.add('active');
        }, 500);
      }
    }

    function nextQuestion() {
      document.getElementById('next-modal').classList.remove('active');
      currentQIndex++;
      if (currentQIndex < questions.length) {
        loadQuestion(currentQIndex);
      } else {
        alert('🎊 恭喜完成了所有練習題目！');
        goHome();
      }
    }

    function resetCurrentQuestion() {
      playAudioTone('click');
      loadQuestion(currentQIndex);
    }
  </script>
</body>
</html>
